version:"3.11"
services:
  app:
   image: myapp
   ports:
   -"8000:8000"
   depends_on:
    - prometheus
 prometheus:
   image: prom/prometheus 
   ports:
     -"9000:9000"
   volumes:
     - ./prometheus.yml:/etc/prometheus/prometheus.yml

 grafana:
   image: grafana/grafana
   ports:
    - "3000:3000"